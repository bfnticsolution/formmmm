<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTIC SOLUTION · Formation Dev Web & Mobile · Jour 1 — Projection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bleu: #0B3FA5;
            --bleu-profond: #072a6e;
            --bleu-clair: #e8f0fe;
            --orange: #FF6B35;
            --orange-vif: #ff5722;
            --orange-clair: #fff4e5;
            --vert: #059669;
            --vert-clair: #ecfdf5;
            --violet: #7c3aed;
            --violet-clair: #f3e8ff;
            --rouge: #dc2626;
            --rouge-clair: #fef2f2;
            --jaune: #f59e0b;
            --jaune-clair: #fffbeb;
            --gris-fond: #f4f6fa;
            --texte: #1e293b;
            --texte-secondaire: #475569;
            --blanc: #ffffff;
            --bordure: #e2e8f0;
            --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: var(--texte);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* ===== ÉCRAN DE CODE D'ACCÈS ===== */
        .access-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(135deg, var(--bleu-profond) 0%, #0d1b3e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        .access-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .access-card {
            background: var(--blanc);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 90%;
            animation: floatIn 0.8s ease;
        }
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .access-card .logo-symbol {
            background: var(--bleu);
            color: white;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0 auto 1.2rem;
        }
        .access-card h2 {
            color: var(--bleu);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .access-card p {
            color: #475569;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
        }
        .access-input {
            width: 100%;
            padding: 0.9rem 1.3rem;
            border: 2px solid var(--bordure);
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            transition: var(--transition);
            margin-bottom: 1rem;
        }
        .access-input:focus {
            outline: none;
            border-color: var(--bleu);
            box-shadow: 0 0 0 4px rgba(11, 63, 165, 0.1);
        }
        .access-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }
        .access-btn:hover {
            background: var(--orange-vif);
            transform: translateY(-2px);
        }
        .access-error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            font-weight: 600;
        }
        .access-error.visible {
            display: block;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ===== CONTAINER ===== */
        .presentation-container {
            display: none;
            position: fixed;
            inset: 0;
            background: #0d1117;
            z-index: 100;
        }
        .presentation-container.active {
            display: block;
        }

        .slide-stage {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-content {
            background: white;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 3.5rem 4.5rem;
            position: relative;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .nav-hint {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 500;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* ===== ANIMATIONS ===== */
        .anim-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }
        .anim-item:nth-child(1) {
            animation-delay: 0.1s;
        }
        .anim-item:nth-child(2) {
            animation-delay: 0.25s;
        }
        .anim-item:nth-child(3) {
            animation-delay: 0.4s;
        }
        .anim-item:nth-child(4) {
            animation-delay: 0.55s;
        }
        .anim-item:nth-child(5) {
            animation-delay: 0.7s;
        }
        .anim-item:nth-child(6) {
            animation-delay: 0.85s;
        }
        .anim-item:nth-child(7) {
            animation-delay: 1s;
        }
        .anim-item:nth-child(8) {
            animation-delay: 1.15s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== TYPOGRAPHIE ===== */
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--bleu);
            line-height: 1.1;
        }
        h2 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--bleu);
            line-height: 1.2;
        }
        h3 {
            font-size: 1.6rem;
            font-weight: 700;
        }
        h4 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        p {
            font-size: 1.35rem;
            line-height: 1.5;
        }
        li {
            font-size: 1.25rem;
            line-height: 1.6;
        }
        .subtitle {
            font-size: 1.7rem;
            font-weight: 500;
            color: var(--texte-secondaire);
        }

        /* ===== CARDS ===== */
        .card-grid {
            display: grid;
            gap: 1.8rem;
            margin: 1.8rem 0;
        }
        .card-grid.cols-2 {
            grid-template-columns: 1fr 1fr;
        }
        .card-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .card-grid.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .card {
            background: #f8fafc;
            border-radius: 18px;
            padding: 1.8rem;
            border: 1px solid var(--bordure);
            text-align: center;
        }
        .card i {
            font-size: 2.8rem;
            color: var(--bleu);
            margin-bottom: 0.8rem;
        }
        .card h4 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
        }
        .card p {
            font-size: 1rem;
            color: var(--texte-secondaire);
        }

        /* ===== BOXES ===== */
        .box {
            border-radius: 16px;
            padding: 1.2rem 1.8rem;
            margin: 1.2rem 0;
            font-size: 1.25rem;
            font-weight: 500;
            border-left: 6px solid;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }
        .box i {
            font-size: 1.5rem;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }
        .box-tip {
            background: #e8f0fe;
            border-color: var(--bleu);
            color: #0a2c5c;
        }
        .box-important {
            background: var(--orange-clair);
            border-color: var(--orange);
            color: #6b3a1f;
        }
        .box-success {
            background: var(--vert-clair);
            border-color: var(--vert);
            color: #064e3b;
        }
        .box-warning {
            background: var(--rouge-clair);
            border-color: var(--rouge);
            color: #7f1d1d;
        }
        .box-info {
            background: var(--violet-clair);
            border-color: var(--violet);
            color: #3b0764;
        }

        /* ===== SLIDES SPÉCIALES ===== */
        .slide-cover {
            background: linear-gradient(135deg, #0B3FA5 0%, #072a6e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .slide-cover h1 {
            color: white;
            font-size: 3.5rem;
        }
        .slide-cover .subtitle {
            color: rgba(255, 255, 255, 0.85);
        }

        .slide-objectifs {
            background: white;
        }
        .objectif-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid var(--bordure);
        }
        .objectif-num {
            background: var(--bleu);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .objectif-text {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .slide-question {
            background: var(--jaune-clair);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .slide-question h2 {
            color: #92400e;
        }
        .question-box {
            background: white;
            border: 3px dashed var(--jaune);
            border-radius: 24px;
            padding: 2.5rem;
            margin: 1.5rem 0;
            max-width: 850px;
        }
        .question-box p {
            font-size: 2rem;
            font-weight: 700;
            color: #92400e;
        }

        .slide-exercice {
            background: var(--bleu-clair);
        }
        .slide-exercice h2 {
            color: var(--bleu);
        }
        .exercice-box {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid var(--bleu);
            margin-top: 1.5rem;
        }
        .exercice-box h3 {
            color: var(--bleu);
            font-size: 1.4rem;
        }
        .exercice-box ol {
            padding-left: 1.5rem;
        }
        .exercice-box li {
            margin-bottom: 0.8rem;
        }

        .slide-recap {
            background: var(--jaune-clair);
        }
        .slide-recap h2 {
            color: #92400e;
        }

        .slide-next {
            background: linear-gradient(135deg, #FF6B35 0%, #e55a2b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .slide-next h2 {
            color: white;
            font-size: 2.8rem;
        }

        /* ===== TABLEAUX ===== */
        .table-simple {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.15rem;
            background: white;
            border-radius: 14px;
            overflow: hidden;
        }
        .table-simple th {
            background: var(--bleu);
            color: white;
            padding: 0.9rem 1.2rem;
            text-align: left;
            font-weight: 700;
        }
        .table-simple td {
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid var(--bordure);
        }
        .table-simple tr:last-child td {
            border-bottom: none;
        }

        /* ===== CODE ===== */
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 14px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-x: auto;
            margin: 1rem 0;
        }
        code {
            background: #f1f5f9;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        /* ===== TERMES (nouvelle slide) ===== */
        .term-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .term-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border-left: 6px solid var(--bleu);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .term-card h4 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--bleu);
        }
        .term-card p {
            font-size: 1.05rem;
            margin-top: 0.3rem;
            color: var(--texte-secondaire);
        }
        .term-card .meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--bleu);
            margin-top: 0.4rem;
            opacity: 0.7;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .slide-content {
                padding: 2rem;
            }
            h1 {
                font-size: 2rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            p,
            li {
                font-size: 1rem;
            }
            .card-grid.cols-2,
            .card-grid.cols-3,
            .card-grid.cols-4 {
                grid-template-columns: 1fr;
            }
            .term-grid {
                grid-template-columns: 1fr;
            }
            .access-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
