<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTIC SOLUTION · Jour 3 — Maîtrise du code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ========================================
           VARIABLES
           ======================================== */
        :root {
            --bleu: #0B3FA5;
            --bleu-clair: #e8f0fe;
            --bleu-fonce: #072a6e;
            --orange: #FF6B35;
            --orange-clair: #fff4e5;
            --vert: #059669;
            --vert-clair: #ecfdf5;
            --violet: #7c3aed;
            --violet-clair: #f3e8ff;
            --rouge: #dc2626;
            --rouge-clair: #fef2f2;
            --jaune: #f59e0b;
            --jaune-clair: #fffbeb;
            --gris: #f1f5f9;
            --gris-fonce: #475569;
            --texte: #1e293b;
            --blanc: #ffffff;
            --bordure: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           RESET
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0d1117;
            color: var(--texte);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* ========================================
           CONTAINER
           ======================================== */
        .presentation-container {
            position: fixed;
            inset: 0;
            background: #0d1117;
            z-index: 100;
        }

        .slide-stage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-content {
            background: var(--blanc);
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 3rem 4.5rem;
            position: relative;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ========================================
           PROGRESS BAR
           ======================================== */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 200;
            height: 4px;
            background: var(--orange);
            transition: width 0.4s ease;
            border-radius: 0 2px 2px 0;
        }

        .slide-counter {
            position: fixed;
            bottom: 1.2rem;
            left: 1.5rem;
            z-index: 200;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .nav-hint {
            position: fixed;
            bottom: 1.2rem;
            right: 1.5rem;
            z-index: 200;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        /* ========================================
           ANIMATIONS
           ======================================== */
        .anim-item {
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp 0.7s ease forwards;
        }

        .anim-item:nth-child(1) {
            animation-delay: 0.05s;
        }
        .anim-item:nth-child(2) {
            animation-delay: 0.15s;
        }
        .anim-item:nth-child(3) {
            animation-delay: 0.25s;
        }
        .anim-item:nth-child(4) {
            animation-delay: 0.35s;
        }
        .anim-item:nth-child(5) {
            animation-delay: 0.45s;
        }
        .anim-item:nth-child(6) {
            animation-delay: 0.55s;
        }
        .anim-item:nth-child(7) {
            animation-delay: 0.65s;
        }
        .anim-item:nth-child(8) {
            animation-delay: 0.75s;
        }
        .anim-item:nth-child(9) {
            animation-delay: 0.85s;
        }
        .anim-item:nth-child(10) {
            animation-delay: 0.95s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           TYPOGRAPHIE
           ======================================== */
        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--bleu);
            line-height: 1.1;
        }

        h2 {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--bleu);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        h4 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--gris-fonce);
        }

        .subtitle {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--gris-fonce);
        }

        /* ========================================
           SLIDES SPÉCIALES
           ======================================== */
        .slide-cover {
            background: linear-gradient(135deg, var(--bleu-fonce) 0%, #0d1b3e 100%);
            color: var(--blanc);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .slide-cover h1 {
            color: var(--blanc);
            font-size: 3.5rem;
        }

        .slide-cover .subtitle {
            color: rgba(255, 255, 255, 0.85);
        }

        .slide-cover p {
            color: rgba(255, 255, 255, 0.7);
        }

        .slide-cover .highlight {
            color: var(--orange);
        }

        .slide-next {
            background: linear-gradient(135deg, var(--orange) 0%, #e55a2b 100%);
            color: var(--blanc);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .slide-next h1,
        .slide-next h2 {
            color: var(--blanc);
        }

        .slide-next p {
            color: rgba(255, 255, 255, 0.85);
        }

        .slide-objectifs {
            background: var(--bleu-clair);
        }

        .slide-exercice {
            background: var(--orange-clair);
        }

        .slide-exercice h2 {
            color: #a0401a;
        }

        .slide-recap {
            background: var(--vert-clair);
        }

        .slide-recap h2 {
            color: #064e3b;
        }

        /* ========================================
           OBJECTIFS
           ======================================== */
        .objectif-item {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .objectif-item:last-child {
            border-bottom: none;
        }

        .objectif-num {
            background: var(--bleu);
            color: var(--blanc);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .objectif-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--texte);
        }

        /* ========================================
           CARDS
           ======================================== */
        .card-grid {
            display: grid;
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .card-grid.cols-2 {
            grid-template-columns: 1fr 1fr;
        }
        .card-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .card-grid.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .card {
            background: var(--gris);
            border-radius: var(--radius);
            padding: 1.8rem 1.5rem;
            border: 1px solid var(--bordure);
            text-align: center;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .card i {
            font-size: 2.6rem;
            color: var(--bleu);
            margin-bottom: 0.6rem;
        }

        .card h4 {
            font-size: 1.15rem;
            margin-bottom: 0.3rem;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--gris-fonce);
        }

        /* ========================================
           COMPARAISON
           ======================================== */
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        .compare-col {
            border-radius: var(--radius);
            padding: 1.8rem 1.5rem;
            text-align: center;
            transition: var(--transition);
        }

        .compare-col.negative {
            background: var(--rouge-clair);
            border: 2px solid var(--rouge);
        }

        .compare-col.positive {
            background: var(--vert-clair);
            border: 2px solid var(--vert);
        }

        .compare-col .icon-big {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .compare-col h3 {
            margin-bottom: 0.8rem;
        }

        .compare-col ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        .compare-col ul li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 1.05rem;
        }

        .compare-col ul li:last-child {
            border-bottom: none;
        }

        .compare-col.negative ul li::before {
            content: "✗ ";
            color: var(--rouge);
            font-weight: 700;
        }

        .compare-col.positive ul li::before {
            content: "✓ ";
            color: var(--vert);
            font-weight: 700;
        }

        /* ========================================
           BOXES
           ======================================== */
        .box {
            border-radius: var(--radius);
            padding: 1.2rem 1.8rem;
            margin: 1.2rem 0;
            font-size: 1.15rem;
            font-weight: 500;
            border-left: 6px solid;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            transition: var(--transition);
        }

        .box i {
            font-size: 1.4rem;
            flex-shrink: 0;
            margin-top: 0.15rem;
        }

        .box-tip {
            background: var(--bleu-clair);
            border-color: var(--bleu);
            color: #0a2c5c;
        }

        .box-important {
            background: var(--orange-clair);
            border-color: var(--orange);
            color: #6b3a1f;
        }

        .box-success {
            background: var(--vert-clair);
            border-color: var(--vert);
            color: #064e3b;
        }

        .box-warning {
            background: var(--rouge-clair);
            border-color: var(--rouge);
            color: #7f1d1d;
        }

        .box-info {
            background: var(--violet-clair);
            border-color: var(--violet);
            color: #3b0764;
        }

        /* ========================================
           TABLEAUX
           ======================================== */
        .table-wrapper {
            overflow-x: auto;
            margin: 1.2rem 0;
            border-radius: var(--radius);
            border: 1px solid var(--bordure);
        }

        .table-simple {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.05rem;
            background: var(--blanc);
        }

        .table-simple th {
            background: var(--bleu);
            color: var(--blanc);
            padding: 0.9rem 1.2rem;
            text-align: left;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-simple td {
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid var(--bordure);
        }

        .table-simple tr:last-child td {
            border-bottom: none;
        }

        .table-simple tr:nth-child(even) td {
            background: #fafbfc;
        }

        .table-simple tr:hover td {
            background: var(--bleu-clair);
        }

        /* ========================================
           CODE
           ======================================== */
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: var(--radius);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid #334155;
        }

        pre .comment {
            color: #94a3b8;
        }

        pre .tag {
            color: #f472b6;
        }

        pre .attr {
            color: #60a5fa;
        }

        pre .string {
            color: #a3e635;
        }

        pre .selector {
            color: #fbbf24;
        }

        pre .property {
            color: #34d399;
        }

        code {
            background: var(--gris);
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--bleu-fonce);
        }

        .exercice-box {
            background: var(--blanc);
            border-radius: var(--radius);
            padding: 2rem;
            border: 2px solid var(--bleu);
            margin-top: 1.5rem;
            box-shadow: var(--shadow);
        }

        .exercice-box h3 {
            color: var(--bleu);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .exercice-box ol {
            padding-left: 1.5rem;
        }

        .exercice-box li {
            font-size: 1.1rem;
            margin-bottom: 0.6rem;
            color: var(--texte);
        }

        /* ========================================
           BLOCKS LIST
           ======================================== */
        .block-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin: 1rem 0;
        }

        .block-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--gris);
            padding: 0.6rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--bordure);
            transition: var(--transition);
        }

        .block-item:hover {
            background: var(--bleu-clair);
            border-color: var(--bleu);
        }

        .block-item .num {
            background: var(--bleu);
            color: var(--blanc);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .block-item .role {
            font-size: 0.9rem;
            color: var(--gris-fonce);
        }

        .block-item strong {
            font-size: 0.95rem;
        }

        /* ========================================
           TERMS
           ======================================== */
        .term-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .term-card {
            background: var(--blanc);
            border-radius: var(--radius);
            padding: 1.5rem;
            border-left: 6px solid var(--bleu);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .term-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .term-card h4 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--bleu);
        }

        .term-card p {
            font-size: 1rem;
            margin-top: 0.3rem;
            color: var(--gris-fonce);
        }

        /* ========================================
           STATS
           ======================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: var(--gris);
            border-radius: var(--radius);
            border: 1px solid var(--bordure);
        }

        .stat-item .number {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--bleu);
        }

        .stat-item .label {
            font-size: 0.95rem;
            color: var(--gris-fonce);
            margin-top: 0.2rem;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 1024px) {
            .slide-content {
                padding: 2.5rem 3rem;
            }
        }

        @media (max-width: 768px) {
            .slide-content {
                padding: 1.8rem 1.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            p {
                font-size: 1rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .card-grid.cols-2,
            .card-grid.cols-3,
            .card-grid.cols-4 {
                grid-template-columns: 1fr;
            }

            .compare-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .term-grid {
                grid-template-columns: 1fr;
            }

            .block-list {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .table-simple {
                font-size: 0.85rem;
            }

            .table-simple th,
            .table-simple td {
                padding: 0.4rem 0.6rem;
            }

            .slide-cover h1 {
                font-size: 2rem;
            }

            .slide-next h1 {
                font-size: 2rem;
            }

            .nav-hint,
            .slide-counter {
                font-size: 0.6rem;
                padding: 0.2rem 0.7rem;
            }

            pre {
                font-size: 0.75rem;
                padding: 1rem;
            }

            .exercice-box {
                padding: 1.2rem;
            }

            .exercice-box li {
                font-size: 0.95rem;
            }

            .objectif-text {
                font-size: 1rem;
            }

            .objectif-num {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .box {
                font-size: 1rem;
                padding: 1rem 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .slide-content {
                padding: 1.2rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }

            .stat-item .number {
                font-size: 2rem;
            }

            .compare-col {
                padding: 1.2rem 1rem;
            }

            .compare-col ul li {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================
    CONTENEUR PROJECTION
    ======================================== -->
    <div class="presentation-container">
        <div class="slide-stage" id="slideStage"></div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="slide-counter" id="slideCounter">1 / 26</div>
        <div class="nav-hint">← → naviguer · Échap quitter</div>
    </div>

        // ============================================================
        // 2. ÉTAT
        // ============================================================
        let currentSlide = 0;
        const totalSlides = slidesData.length;

        // ============================================================
        // 3. FONCTIONS D'AFFICHAGE
        // ============================================================
        function renderSlide(index) {
            const stage = document.getElementById('slideStage');
            const slide = slidesData[index];
            stage.innerHTML = `<div class="slide-content ${slide.className}">${slide.content}</div>`;
            updateProgress(index);
            updateCounter(index);
        }

        function updateProgress(index) {
            const progress = ((index + 1) / totalSlides) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function updateCounter(index) {
            document.getElementById('slideCounter').textContent = (index + 1) + ' / ' + totalSlides;
        }

        function goNext() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                renderSlide(currentSlide);
            }
        }

        function goPrev() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide);
            }
        }

        // ============================================================
        // 4. INITIALISATION
        // ============================================================
        renderSlide(currentSlide);

        // ============================================================
        // 5. NAVIGATION CLAVIER / TACTILE
        // ============================================================
        document.addEventListener('keydown', function(e) {
            const container = document.querySelector('.presentation-container');
            if (!container) return;

            switch (e.key) {
                case 'ArrowRight':
                case ' ':
                case 'PageDown':
                case 'ArrowDown':
                    e.preventDefault();
                    goNext();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                case 'ArrowUp':
                    e.preventDefault();
                    goPrev();
                    break;
                case 'Escape':
                    if (confirm('Quitter la projection ?')) {
                        document.querySelector('.presentation-container').style.display = 'none';
                    }
                    break;
                case 'Home':
                    e.preventDefault();
                    currentSlide = 0;
                    renderSlide(currentSlide);
                    break;
                case 'End':
                    e.preventDefault();
                    currentSlide = totalSlides - 1;
                    renderSlide(currentSlide);
                    break;
            }
        });

        // Navigation tactile
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', function(e) {
            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                if (deltaX < 0) goNext();
                else goPrev();
            }
        });

        // Scroll sur les slides (pour les ordinateurs portables)
        let scrollTimeout = false;

        document.addEventListener('wheel', function(e) {
            if (scrollTimeout) return;
            const container = document.querySelector('.presentation-container');
            if (!container || container.style.display === 'none') return;

            // Ne déclencher que si le scroll est significatif
            if (Math.abs(e.deltaY) > 40) {
                scrollTimeout = true;
                if (e.deltaY > 0) {
                    goNext();
                } else {
                    goPrev();
                }
                setTimeout(() => { scrollTimeout = false; }, 600);
            }
        }, { passive: true });
    </script>
