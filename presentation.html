<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTIC SOLUTION · Formation Bureautique · Jour 1 — Présentation pédagogique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bleu: #0B3FA5;
      --bleu-profond: #072a6e;
      --bleu-clair: #e8f0fe;
      --orange: #FF6B35;
      --orange-vif: #ff5722;
      --orange-clair: #fff4e5;
      --vert: #059669;
      --vert-clair: #ecfdf5;
      --gris-fond: #f4f6fa;
      --texte: #1e293b;
      --texte-secondaire: #475569;
      --blanc: #ffffff;
      --bordure: #e2e8f0;
      --ombre: 0 25px 50px rgba(11, 63, 165, 0.12), 0 6px 18px rgba(0,0,0,0.08);
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: var(--texte);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ========== ÉCRAN DE CODE D'ACCÈS ========== */
    .access-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(135deg, var(--bleu-profond) 0%, #0d1b3e 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .access-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .access-card {
      background: var(--blanc); border-radius: 2rem; padding: 3rem 2.5rem;
      text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      max-width: 440px; width: 90%; animation: floatIn 0.8s ease;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .access-card .logo-symbol {
      background: var(--bleu); color: white; width: 64px; height: 64px;
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.8rem; margin: 0 auto 1.2rem;
    }
    .access-card h2 { color: var(--bleu); font-size: 1.5rem; margin-bottom: 0.5rem; }
    .access-card p { color: var(--texte-secondaire); margin-bottom: 1.8rem; font-size: 0.95rem; }
    .access-input {
      width: 100%; padding: 0.9rem 1.3rem; border: 2px solid var(--bordure);
      border-radius: 14px; font-family: inherit; font-size: 1rem;
      text-align: center; letter-spacing: 2px; transition: var(--transition); margin-bottom: 1rem;
    }
    .access-input:focus { outline: none; border-color: var(--bleu); box-shadow: 0 0 0 4px rgba(11,63,165,0.1); }
    .access-btn {
      width: 100%; padding: 0.9rem; background: var(--orange); color: white;
      border: none; border-radius: 14px; font-weight: 700; font-size: 1rem;
      font-family: inherit; cursor: pointer; transition: var(--transition); letter-spacing: 0.5px;
    }
    .access-btn:hover { background: var(--orange-vif); transform: translateY(-2px); }
    .access-error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; display: none; font-weight: 600; }
    .access-error.visible { display: block; animation: shake 0.5s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); }
    }

    /* ========== CONTAINER PRINCIPAL ========== */
    .presentation-container {
      display: none;
      position: fixed; inset: 0;
      background: #0d1117;
      z-index: 100;
    }
    .presentation-container.active { display: block; }

    /* ========== ZONE DE PROJECTION ========== */
    .slide-stage {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 70px;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .slide-content {
      background: white;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      width: 100%;
      height: 100%;
      max-width: 1100px;
      overflow-y: auto;
      padding: 2.5rem 3rem;
      position: relative;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* ========== BARRE DE CONTRÔLE ========== */
    .control-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
      background: #1a1f2e; border-top: 1px solid #2a3040;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; gap: 1rem;
    }
    .control-left { display: flex; align-items: center; gap: 0.8rem; }
    .control-center { display: flex; align-items: center; gap: 1rem; flex: 1; justify-content: center; }
    .control-right { display: flex; align-items: center; gap: 0.8rem; }

    .btn-nav {
      background: #2a3040; color: white; border: none;
      width: 42px; height: 42px; border-radius: 10px;
      cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .btn-nav:hover { background: var(--bleu); }
    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

    .slide-counter {
      color: #a0a8b8; font-weight: 600; font-size: 0.9rem;
      min-width: 80px; text-align: center;
    }
    .progress-track {
      flex: 1; max-width: 250px; height: 4px;
      background: #2a3040; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--orange);
      border-radius: 4px; transition: width 0.4s ease;
    }
    .btn-fullscreen {
      background: #2a3040; color: white; border: none;
      padding: 0.5rem 1rem; border-radius: 10px;
      cursor: pointer; font-family: inherit; font-size: 0.85rem;
      font-weight: 600; transition: var(--transition);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-fullscreen:hover { background: var(--bleu); }

    /* ========== THUMBNAILS ========== */
    .thumbnails-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; display: none;
      align-items: flex-start; justify-content: center;
      padding: 2rem; overflow-y: auto;
    }
    .thumbnails-overlay.active { display: flex; }
    .thumbnails-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem; max-width: 1000px; width: 100%;
    }
    .thumbnail-card {
      background: #1a1f2e; border: 2px solid #2a3040; border-radius: 12px;
      padding: 1rem; text-align: center; cursor: pointer; transition: var(--transition);
      color: #a0a8b8;
    }
    .thumbnail-card:hover { border-color: var(--orange); color: white; }
    .thumbnail-card.active { border-color: var(--orange); background: #2a3040; color: white; }
    .thumbnail-card .phase-label {
      display: block; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 0.3rem; color: var(--orange);
    }
    .thumbnail-card i { font-size: 1.2rem; margin-bottom: 0.4rem; display: block; }
    .thumbnail-card span { font-size: 0.75rem; font-weight: 600; }
    .close-thumbnails {
      position: fixed; top: 1rem; right: 1rem;
      background: #dc2626; color: white; border: none;
      width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; font-size: 1.2rem; z-index: 1001;
    }

    /* ========== CONTENU DES SLIDES ========== */
    .slide-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
    .phase-badge {
      background: var(--vert-clair); color: var(--vert);
      font-weight: 700; font-size: 0.7rem; padding: 0.3rem 0.9rem;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .phase-badge.demo { background: #fff4e5; color: #d97706; }
    .phase-badge.practice { background: var(--bleu-clair); color: var(--bleu); }
    .phase-badge.interaction { background: #f3e8ff; color: #7c3aed; }
    .phase-badge.consolidation { background: #fef3c7; color: #92400e; }

    .duration-badge {
      background: var(--orange-clair); color: var(--orange);
      font-weight: 700; font-size: 0.75rem; padding: 0.3rem 0.9rem;
      border-radius: 20px;
    }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin: 0.5rem 0; color: var(--bleu); }
    h2 {
      font-size: 1.5rem; font-weight: 700; color: var(--bleu);
      margin: 0.8rem 0; padding-bottom: 0.3rem;
      border-bottom: 3px solid var(--orange); display: inline-block;
    }
    h3 { font-size: 1.15rem; font-weight: 700; margin: 0.8rem 0 0.4rem; }
    h4 { font-size: 1rem; font-weight: 700; margin: 0.6rem 0 0.3rem; }

    .formateur-instruction {
      background: #1e293b; color: white;
      border-radius: 14px; padding: 1rem 1.3rem;
      margin: 1rem 0; font-size: 0.95rem;
      border-left: 5px solid var(--orange);
    }
    .formateur-instruction i { color: var(--orange); margin-right: 0.5rem; }
    .formateur-instruction strong { color: #fbbf24; }

    .question-ouverture {
      background: #fef3c7; border-radius: 14px; padding: 1.2rem 1.5rem;
      margin: 1rem 0; font-size: 1.1rem; font-weight: 600;
      border: 2px dashed #f59e0b;
    }
    .question-ouverture i { color: #f59e0b; margin-right: 0.5rem; }

    .consigne-exercice {
      background: var(--bleu-clair); border-radius: 14px; padding: 1.2rem 1.5rem;
      margin: 1rem 0; border: 2px solid var(--bleu);
    }
    .consigne-exercice h3 { color: var(--bleu); margin-top: 0; }
    .consigne-exercice ol { padding-left: 1.2rem; line-height: 1.8; }

    .critere-reussite {
      background: var(--vert-clair); border-radius: 12px; padding: 0.8rem 1.2rem;
      margin: 0.8rem 0; font-weight: 600; color: #064e3b;
      border: 1px solid #059669;
    }
    .critere-reussite i { color: #059669; margin-right: 0.5rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 0.8rem 0; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 0.8rem 0; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin: 0.8rem 0; }

    @media (max-width: 900px) {
      .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .slide-content { padding: 1.8rem; }
    }
    @media (max-width: 600px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      h1 { font-size: 1.4rem; }
      .slide-content { padding: 1.2rem; }
    }

    .card {
      background: #f8fafc; border-radius: 14px; padding: 1rem;
      border: 1px solid var(--bordure); text-align: center;
    }
    .card i { font-size: 1.5rem; color: var(--bleu); margin-bottom: 0.4rem; }

    .box {
      border-radius: 12px; padding: 0.9rem 1.1rem; margin: 0.8rem 0;
      display: flex; align-items: flex-start; gap: 0.7rem;
      font-weight: 500; border-left: 5px solid; font-size: 0.9rem;
    }
    .box i { font-size: 1.1rem; margin-top: 0.1rem; flex-shrink: 0; }
    .box-tip { background: #e8f0fe; border-color: var(--bleu); color: #0a2c5c; }
    .box-warning { background: #fff4e5; border-color: var(--orange); color: #6b3a1f; }
    .box-remember { background: #ecfdf5; border-color: #059669; color: #064e3b; }
    .box-info { background: #f3e8ff; border-color: #7c3aed; color: #3b0764; }

    .table-wrapper { overflow-x: auto; margin: 0.8rem 0; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: white; }
    th { background: var(--bleu); color: white; font-weight: 700; padding: 0.6rem 0.9rem; text-align: left; }
    td { padding: 0.5rem 0.9rem; border-bottom: 1px solid var(--bordure); }
    tr:last-child td { border-bottom: none; }

    .highlight { background: #fef3c7; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; }
    code, kbd {
      background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 4px;
      font-family: 'Courier New', monospace; font-size: 0.9em;
    }

    /* Slides spéciales */
    .slide-cover {
      background: linear-gradient(135deg, #0B3FA5 0%, #0d2f6b 100%);
      color: white; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .slide-cover h1 { color: white; font-size: 2.8rem; }
    .slide-recap { background: #fffbeb; }
    .slide-recap h2 { color: #92400e; border-bottom-color: #f59e0b; }
    .slide-next {
      background: linear-gradient(135deg, #FF6B35 0%, #e55a2b 100%);
      color: white; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .slide-next h2 { color: white; border-bottom-color: rgba(255,255,255,0.5); }

    .keyboard-visual {
      display: flex; flex-wrap: wrap; gap: 0.2rem; justify-content: center;
      background: #e2e8f0; padding: 0.8rem; border-radius: 10px; margin: 0.6rem 0;
    }
    .key {
      background: white; border: 1px solid #cbd5e1; border-radius: 5px;
      padding: 0.3rem 0.5rem; font-weight: 600; font-size: 0.65rem;
      min-width: 24px; text-align: center;
    }
    .key.highlight-key { background: var(--orange); color: white; border-color: var(--orange); }
    .key.blue-key { background: var(--bleu); color: white; border-color: var(--bleu); }

    pre {
      background: #1e293b; color: white; padding: 0.8rem; border-radius: 10px;
      font-size: 0.75rem; line-height: 1.5; overflow-x: auto;
    }
  </style>
</head>
<body>

<!-- CODE D'ACCÈS -->
<div class="access-overlay" id="accessOverlay">
  <div class="access-card">
    <div class="logo-symbol">NT</div>
    <h2>Accès présentation</h2>
    <p>Veuillez saisir le code d'accès pour lancer le support du Jour 1.</p>
    <input type="password" class="access-input" id="accessInput" placeholder="Code d'accès" autocomplete="off">
    <button class="access-btn" onclick="checkAccess()"><i class="fas fa-lock-open"></i> Lancer la présentation</button>
    <div class="access-error" id="accessError">Code incorrect. Veuillez réessayer.</div>
  </div>
</div>

<!-- CONTENEUR PRÉSENTATION -->
<div class="presentation-container" id="presentationContainer">
  <div class="slide-stage" id="slideStage"></div>
  <div class="control-bar">
    <div class="control-left">
      <button class="btn-nav" title="Voir les diapositives" onclick="toggleThumbnails()">
        <i class="fas fa-th-large"></i>
      </button>
      <span class="slide-counter" id="slideCounter">1 / 20</span>
    </div>
    <div class="control-center">
      <button class="btn-nav" id="btnPrev" title="Précédent" onclick="goPrev()"><i class="fas fa-chevron-left"></i></button>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <button class="btn-nav" id="btnNext" title="Suivant" onclick="goNext()"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="control-right">
      <button class="btn-fullscreen" title="Plein écran" onclick="toggleFullscreen()">
        <i class="fas fa-expand"></i> <span>Plein écran</span>
      </button>
      <button class="btn-nav" title="Quitter" onclick="quitPresentation()"><i class="fas fa-times"></i></button>
    </div>
  </div>
</div>

<!-- THUMBNAILS -->
<div class="thumbnails-overlay" id="thumbnailsOverlay">
  <button class="close-thumbnails" onclick="toggleThumbnails()"><i class="fas fa-times"></i></button>
  <div class="thumbnails-grid" id="thumbnailsGrid"></div>
</div>

<script>
  // ========== DONNÉES DES SLIDES — CHRONOLOGIE PÉDAGOGIQUE ==========
  const slidesData = [
    // ==================== PHASE 1 : OUVERTURE (10 min) ====================
    {
      id: 'slide-1',
      phase: 'Ouverture',
      title: 'Accueil',
      content: `

          <span class="phase-badge"><i class="fas fa-door-open"></i> Phase 1 · Ouverture</span>
          <span class="duration-badge">2 minutes</span>
        </div>
        <div style="text-align:center;">
          <h1 style="font-size:2.8rem; color:white;">Jour 1</h1>
          <p style="font-size:1.4rem; color:rgba(255,255,255,0.9);">Découverte de l'ordinateur & Windows</p>
          <div style="margin-top:1.5rem; background:rgba(255,255,255,0.1); border-radius:16px; padding:1.5rem; display:inline-block; text-align:left;">
            <p style="color:white;"><i class="fas fa-user-tie"></i> <strong>Formateur :</strong> Kévin Kiessé Sanou</p>

      `,

    },
    {
      id: 'slide-2',
      phase: 'Ouverture',
      title: 'Tour de table',
      content: `
        <div class="slide-header">
          <span class="phase-badge"><i class="fas fa-door-open"></i> Phase 1 · Ouverture</span>

        <h2>Faisons connaissance</h2>
        <div class="formateur-instruction">

          <div class="card"><i class="fas fa-user"></i><h4>Votre nom</h4><p style="font-size:0.8rem;">Qui êtes-vous ?</p></div>

    {

        </ol>
        <div class="box box-remember">
          <i class="fas fa-bullseye"></i>
          <div><strong>Méthode :</strong> On comprend → On démontre → Vous pratiquez → Vous validez.</div>
        </div>
      `,
      className: ''
    },

    // ==================== PHASE 2 : DÉCOUVERTE GUIDÉE (20 min) ====================
    {
      id: 'slide-4',
      phase: 'Découverte',
      title: 'Question d\'ouverture',
      content: `
        <div class="slide-header">
          <span class="phase-badge demo"><i class="fas fa-lightbulb"></i> Phase 2 · Découverte</span>
          <span class="duration-badge">3 minutes</span>
        </div>
        <h2>Qu'est-ce qu'un ordinateur pour vous ?</h2>
        <div class="question-ouverture">
          <i class="fas fa-question-circle"></i>
          Question au groupe : « À quoi pensez-vous quand je dis "ordinateur" ? »

        <div class="formateur-instruction">
          <i class="fas fa-chalkboard-teacher"></i>
          <strong>Le formateur :</strong> Recueillez 3-4 réponses des participants. Écrivez les mots-clés au tableau. Rebondissez sur chaque réponse pour construire la définition ensemble.
        </div>
        <div class="grid-3">
          <div class="card"><i class="fas fa-desktop"></i><p style="font-size:0.85rem;">Une machine</p></div>

          <div class="card"><i class="fas fa-globe"></i><p style="font-size:0.85rem;">Une fenêtre sur le monde</p></div>

      `,
      className: ''
    },
    {
      id: 'slide-5',
      phase: 'Découverte',
      title: 'Définition construite',
      content: `
        <div class="slide-header">
          <span class="phase-badge demo"><i class="fas fa-lightbulb"></i> Phase 2 · Découverte</span>
          <span class="duration-badge">5 minutes</span>
        </div>
        <h2>Un ordinateur, c'est...</h2>
        <p style="font-size:1.1rem;">Une machine électronique qui <span class="highlight">reçoit</span> des informations, les <span class="highlight">traite</span>, puis <span class="highlight">produit</span> un résultat.</p>

          <span class="module-badge"><i class="fas fa-calendar-check"></i> Suite</span>
        </div>
        <h2 style="font-size:2rem;">Rendez-vous pour le Jour 2</h2>
        <p style="font-size:1.5rem; font-weight:600;">Microsoft Word</p>
        <p>Création et mise en forme de documents professionnels.</p>
        <p style="margin-top:1.5rem;"><i class="fas fa-phone"></i> +226 05 58 58 68 | <i class="fab fa-whatsapp"></i> +226 69 69 69 24</p>
      `,
      className: 'slide-next'
    }
  ];

  // ========== ÉTAT ==========
  let currentSlide = 0;
  const totalSlides = slidesData.length;

  // ========== FONCTIONS ==========
  function checkAccess() {
    const input = document.getElementById('accessInput');
    const error = document.getElementById('accessError');
    if (input.value.trim() === 'NTICBANFORA') {
      document.getElementById('accessOverlay').classList.add('hidden');
      document.getElementById('presentationContainer').classList.add('active');
      initPresentation();
      renderSlide(currentSlide);
    } else {
      error.classList.add('visible');
      input.value = '';
      input.focus();
      setTimeout(() => error.classList.remove('visible'), 2500);
    }
  }

  document.getElementById('accessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAccess();
  });

  function initPresentation() {
    buildThumbnails();
    updateCounter();
    updateProgress();
    updateButtons();
  }

  function renderSlide(index) {
    const stage = document.getElementById('slideStage');
    const slide = slidesData[index];
    stage.innerHTML = `
      <div class="slide-content ${slide.className}" id="currentSlideContent">
        ${slide.content}
      </div>
    `;
    updateCounter();
    updateProgress();
    updateButtons();
    updateThumbnailsActive();
  }

  function goNext() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      renderSlide(currentSlide);
    }
  }

  function goPrev() {
    if (currentSlide > 0) {
      currentSlide--;
      renderSlide(currentSlide);
    }
  }

  function goToSlide(index) {
    if (index >= 0 && index < totalSlides) {
      currentSlide = index;
      renderSlide(currentSlide);
      toggleThumbnails();
    }
  }

  function updateCounter() {
    document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${totalSlides}`;
  }

  function updateProgress() {
    const pct = ((currentSlide + 1) / totalSlides) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function updateButtons() {
    document.getElementById('btnPrev').disabled = currentSlide === 0;
    document.getElementById('btnNext').disabled = currentSlide === totalSlides - 1;
  }

  function buildThumbnails() {
    const grid = document.getElementById('thumbnailsGrid');
    grid.innerHTML = '';
    slidesData.forEach((slide, index) => {
      const card = document.createElement('div');
      card.className = 'thumbnail-card';
      card.innerHTML = `
        <span class="phase-label">${slide.phase}</span>
        <i class="fas fa-file-alt"></i>
        <span>${index + 1}. ${slide.title}</span>
      `;
      card.onclick = () => goToSlide(index);
      grid.appendChild(card);
    });
  }

  function updateThumbnailsActive() {
    const cards = document.querySelectorAll('.thumbnail-card');
    cards.forEach((card, index) => {
      card.classList.toggle('active', index === currentSlide);
    });
  }

  function toggleThumbnails() {
    document.getElementById('thumbnailsOverlay').classList.toggle('active');
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function quitPresentation() {
    if (confirm('Voulez-vous vraiment quitter la présentation ?')) {
      document.getElementById('presentationContainer').classList.remove('active');
      document.getElementById('accessOverlay').classList.remove('hidden');
      currentSlide = 0;
    }
  }

  // ========== NAVIGATION CLAVIER ==========
  document.addEventListener('keydown', function(e) {
    const container = document.getElementById('presentationContainer');
    if (!container.classList.contains('active')) return;

    switch(e.key) {
      case 'ArrowRight':
      case ' ':
      case 'PageDown':
        e.preventDefault();
        goNext();
        break;
      case 'ArrowLeft':
      case 'PageUp':
        e.preventDefault();
        goPrev();
        break;
      case 'Home':
        e.preventDefault();
        goToSlide(0);
        break;
      case 'End':
        e.preventDefault();
        goToSlide(totalSlides - 1);
        break;
      case 'Escape':
        quitPresentation();
        break;
      case 'f':
      case 'F':
        toggleFullscreen();
        break;
    }
  });

  // ========== GESTURE TACTILE ==========
  let touchStartX = 0;
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
  });
  document.addEventListener('touchend', function(e) {
    const deltaX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(deltaX) > 60) {
      if (deltaX < 0) goNext();
      else goPrev();
    }
  });
</script>

</body>
</html>
